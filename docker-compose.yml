services:

  # ──────────────────────────────────────────────────────
  # MongoDB — persistent database
  # ──────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: bgverify-mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: bgverify
    volumes:
      - mongo_data:/data/db
      - ./mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    networks:
      - bgverify-internal
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s

  # ──────────────────────────────────────────────────────
  # Backend — Node.js / Express / TypeScript API
  # ──────────────────────────────────────────────────────
  backend:
    build:
      context: ./bgverify-backend
      dockerfile: Dockerfile
    container_name: bgverify-backend
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      API_PREFIX: /api/v1
      MONGODB_URI: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD:-changeme}@mongo:27017/bgverify?authSource=admin
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-7d}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN:-30d}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-900000}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      BGCOIN_PRICE_100: ${BGCOIN_PRICE_100:-9000}
      BGCOIN_PRICE_500: ${BGCOIN_PRICE_500:-42500}
      BGCOIN_PRICE_1000: ${BGCOIN_PRICE_1000:-80000}
    ports:
      - "5000:5000"
    expose:
      - "5000"
    networks:
      - bgverify-internal
    # Playwright needs /dev/shm to be large enough for Chromium
    shm_size: "256mb"

  # ──────────────────────────────────────────────────────
  # Frontend — React (Vite build) served by Nginx
  # Nginx also reverse-proxies /api/ → backend
  # ──────────────────────────────────────────────────────
  frontend:
    build:
      context: ./bgverify-frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api/v1}
    container_name: bgverify-frontend
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${APP_PORT:-80}:80"
    networks:
      - bgverify-internal

volumes:
  mongo_data:
    driver: local

networks:
  bgverify-internal:
    driver: bridge
